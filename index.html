<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播日历｜2026</title><style>
    :root {
      --canvas: #F2F2F0;
      --canvas-2: #E8E8E5;
      --ink: #18181B;
      --ink-2: #18181B; /* zinc-900 */
      --muted: #57575A;
      --hairline: rgba(10,10,10,0.08);
      --hairline-strong: rgba(10,10,10,0.12);
      --innerlight: rgba(255,255,255,0.65);
      --accent: #1F4D3F;       /* deep sage */
      --accent-glow: #5A8C7A;
      --sans: 'Plus Jakarta Sans', 'Geist', 'Cabinet Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Geist Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.16, 1.16, 0.3, 1);
      --shell-radius: 2.25rem;
      --core-radius: calc(2.25rem - 0.4rem);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }

    /* ============ AMBIENT MESH (fixed, pointer-events-none) ============ */
    .mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      overflow: hidden;
    }
    .mesh::before, .mesh::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(90px);
      opacity: 0.18; will-change: transform;
    }
    .mesh::before {
      width: 720px; height: 720px;
      background: radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 60%);
      top: -180px; left: -160px;
      animation: drift1 28s var(--ease) infinite alternate;
    }
    .mesh::after {
      width: 560px; height: 560px;
      background: radial-gradient(circle at 60% 60%, #C9B79A, transparent 60%);
      top: 120px; right: -140px;
      animation: drift2 36s var(--ease) infinite alternate;
    }
    @keyframes drift1 { from { transform: translate3d(0,0,0); } to { transform: translate3d(80px, 60px, 0); } }
    @keyframes drift2 { from { transform: translate3d(0,0,0); } to { transform: translate3d(-60px, 40px, 0); } }
    @media (prefers-reduced-motion: reduce) { .mesh::before, .mesh::after { animation: none; } }

    main, header, footer { position: relative; z-index: 1; }

    /* ============ FLOATING PILL NAV ============ */
    .nav-shell {
      position: sticky; top: 24px; z-index: 50;
      margin: 24px auto 0;
      padding: 6px;
      width: max-content; max-width: calc(100% - 56px);
      border-radius: 999px;
      background: rgba(255,255,255,0.42);
      backdrop-filter: saturate(160%) blur(22px);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.45) inset,
        0 0 0 1px rgba(10,10,10,0.05),
        0 12px 36px -18px rgba(10,10,10,0.18);
    }
    .nav {
      display: flex; align-items: center; gap: 18px;
      padding: 6px 8px 6px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .nav .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
    .nav .brand-mark {
      width: 22px; height: 22px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 1px 2px rgba(10,10,10,0.18);
    }
    .nav ul { list-style: none; display: flex; gap: 6px; margin: 0; padding: 0; }
    .nav ul a {
      display: inline-block; padding: 9px 14px; border-radius: 999px;
      color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 500;
      transition: background 300ms var(--ease);
    }
    .nav ul a:hover { background: rgba(10,10,10,0.05); }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 7px 7px 16px;
      border-radius: 999px;
      background: var(--ink); color: var(--canvas);
      font: 600 13px/1 var(--sans); cursor: pointer; border: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 300ms var(--ease);
    }
    .pill .icon-wrap {
      width: 26px; height: 26px; border-radius: 999px;
      background: rgba(255,255,255,0.14);
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 360ms var(--ease-spring), background 300ms var(--ease);
    }
    .pill:hover .icon-wrap { transform: translate(2px, -1px) scale(1.06); background: rgba(255,255,255,0.22); }
    .pill:active { transform: scale(0.98); }
    .pill svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }

    /* ============ HERO ============ */
    .hero {
      min-height: 100dvh;
      padding: 96px 0 120px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 48px;
      align-items: center;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.6);
      box-shadow: inset 0 0 0 1px var(--hairline);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgba(31,77,63,0.18); }
    .hero h1 {
      font-size: clamp(48px, 7vw, 92px);
      font-weight: 700;
      line-height: 0.96;
      letter-spacing: -0.038em;
      margin: 22px 0 28px;
      max-width: 14ch;
    }
    .hero h1 .soft { color: var(--muted); font-weight: 500; }
    .hero p.lede {
      color: var(--muted);
      font-size: 18px;
      max-width: 52ch;
      margin: 0 0 34px;
      line-height: 1.55;
    }
    .hero .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .ghost {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 18px; border-radius: 999px;
      background: rgba(255,255,255,0.5);
      box-shadow: inset 0 0 0 1px var(--hairline-strong);
      font: 500 13.5px/1 var(--sans); color: var(--ink); cursor: pointer; border: none;
      transition: background 300ms var(--ease), transform 300ms var(--ease);
    }
    .ghost:hover { background: rgba(255,255,255,0.85); }
    .ghost:active { transform: scale(0.98); }

    /* ============ HERO PREVIEW (DOUBLE-BEZEL CARD) ============ */
    .hero-preview {
      position: relative;
      padding: 10px;
      border-radius: var(--shell-radius);
      background: rgba(255,255,255,0.45);
      box-shadow:
        inset 0 1px 0 var(--innerlight),
        0 0 0 1px var(--hairline),
        0 30px 60px -28px rgba(10,10,10,0.22),
        0 12px 24px -16px rgba(10,10,10,0.10);
    }
    .hero-preview .core {
      position: relative;
      border-radius: var(--core-radius);
      background: linear-gradient(180deg, #FAFAF7 0%, #EFEFEB 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), inset 0 0 0 1px var(--hairline);
      padding: 22px;
      overflow: hidden;
    }
    .preview-bar {
      display: flex; gap: 6px; margin-bottom: 18px;
    }
    .preview-bar span { width: 10px; height: 10px; border-radius: 999px; background: rgba(10,10,10,0.10); }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pv-cell {
      border-radius: 16px;
      background: rgba(255,255,255,0.8);
      box-shadow: inset 0 0 0 1px var(--hairline), inset 0 1px 0 rgba(255,255,255,0.8);
      padding: 14px;
    }
    .pv-cell.span2 { grid-column: span 2; }
    .pv-cell h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; }
    .pv-cell p { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
    .pv-cell .meta { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; }
    .pv-cell .num { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 4px; }
    .pv-cell .num small { font-size: 12px; color: var(--muted); margin-left: 4px; font-weight: 500; }
    .ring {
      width: 38px; height: 38px; border-radius: 999px;
      background: conic-gradient(var(--accent) 0 67%, rgba(10,10,10,0.08) 67% 100%);
      mask: radial-gradient(circle 14px, transparent 12px, black 13px);
      -webkit-mask: radial-gradient(circle 14px, transparent 12px, black 13px);
      margin-top: 6px;
    }
    .pv-cell .row { display: flex; align-items: center; gap: 10px; }
    .pulse {
      width: 8px; height: 8px; border-radius: 999px; background: var(--accent);
      box-shadow: 0 0 0 0 rgba(31,77,63,0.4);
      animation: pulse 2.4s var(--ease) infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(31,77,63,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(31,77,63,0); }
      100% { box-shadow: 0 0 0 0 rgba(31,77,63,0); }
    }

    /* ============ SECTION DEFAULTS ============ */
    section.block { padding: 112px 0; position: relative; }
    .section-head { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 56px; }
    .section-head h2 {
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1;
      margin: 16px 0 0;
      max-width: 14ch;
    }
    .section-head p { color: var(--muted); font-size: 16.5px; max-width: 46ch; margin: 0; line-height: 1.55; }

    /* ============ BENTO (double-bezel cards) ============ */
    .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .b-card {
      padding: 8px;
      border-radius: var(--shell-radius);
      background: rgba(255,255,255,0.5);
      box-shadow:
        inset 0 1px 0 var(--innerlight),
        0 0 0 1px var(--hairline),
        0 24px 48px -28px rgba(10,10,10,0.18);
      transition: transform 600ms var(--ease), box-shadow 600ms var(--ease);
    }
    .b-card:hover {
      transform: translateY(-3px);
      box-shadow:
        inset 0 1px 0 var(--innerlight),
        0 0 0 1px var(--hairline),
        0 30px 70px -22px rgba(10,10,10,0.22);
    }
    .b-card .core {
      border-radius: var(--core-radius);
      background: #FCFCFA;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), inset 0 0 0 1px var(--hairline);
      padding: 32px;
      height: 100%;
      display: flex; flex-direction: column;
    }
    .b-card.dark .core {
      background: linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%);
      color: #ECECEA;
    }
    .b-card.dark .core .meta { color: rgba(255,255,255,0.55); }
    .b-card.dark .core p { color: rgba(255,255,255,0.6); }
    .b-card .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
    .b-card h3 { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 10px; }
    .b-card.dark h3 { color: #FFFFFF; }
    .b-card p { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.55; max-width: 36ch; }

    .span-3 { grid-column: span 3; }
    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .row-2 { grid-row: span 2; }

    .stat { display: flex; align-items: baseline; gap: 8px; margin-top: 24px; }
    .stat .big { font-size: 56px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .stat .unit { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

    .codeblock {
      margin-top: auto; padding: 18px;
      border-radius: 18px;
      background: #0E0E0E; color: #ECECEA;
      font-family: var(--mono); font-size: 12px; line-height: 1.65;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .codeblock .k { color: #5A8C7A; }
    .codeblock .s { color: #C9B79A; }
    .codeblock .c { color: rgba(236,236,234,0.4); }

    /* ============ MARQUEE ============ */
    .marquee {
      padding: 56px 0;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
    }
    .marquee-track {
      display: flex; gap: 64px; width: max-content;
      animation: track 32s linear infinite;
      will-change: transform;
    }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    @keyframes track { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-item {
      font-weight: 700; font-size: 22px; letter-spacing: -0.02em; color: var(--ink);
      opacity: 0.55;
      white-space: nowrap;
    }
    .marquee-item em { font-style: normal; color: var(--muted); margin: 0 12px; }

    /* ============ CLOSING (inverted soft surface) ============ */
    .closing {
      padding: 112px 0;
      margin: 56px 28px 28px;
      border-radius: 40px;
      background: linear-gradient(180deg, #131313 0%, #050505 100%);
      color: #F2F2F0;
      position: relative; overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 30px 80px -40px rgba(10,10,10,0.6);
    }
    .closing::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(700px 360px at 30% 0%, rgba(90,140,122,0.32), transparent 70%);
      pointer-events: none;
    }
    .closing-inner { position: relative; max-width: 1040px; padding: 0 32px; margin: 0 auto; text-align: center; }
    .closing h2 { font-size: clamp(40px, 5.5vw, 76px); font-weight: 700; letter-spacing: -0.035em; line-height: 1; margin: 0 0 18px; max-width: 18ch; margin-inline: auto; }
    .closing p { color: rgba(242,242,240,0.65); font-size: 17px; margin: 0 auto 32px; max-width: 48ch; line-height: 1.55; }
    .closing .pill { background: var(--canvas); color: var(--ink); }
    .closing .pill .icon-wrap { background: rgba(10,10,10,0.08); }

    /* ============ FOOTER ============ */
    footer {
      padding: 36px 28px 28px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      letter-spacing: 0.06em;
    }
    footer .row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; max-width: 1240px; margin: 0 auto; padding: 0 28px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--ink); }

    /* ============ RESPONSIVE COLLAPSE ============ */
    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; padding-top: 64px; padding-bottom: 80px; }
      .nav ul { display: none; }
      .section-head { grid-template-columns: 1fr; gap: 18px; }
      .bento { grid-template-columns: 1fr; }
      .span-3, .span-2, .span-4, .span-6 { grid-column: span 1; }
      .row-2 { grid-row: auto; }
      .closing { margin: 28px 16px; padding: 80px 0; }
    }

    /* ============ MOTION ENTRY ============ */
    .reveal { opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity 800ms var(--ease), transform 800ms var(--ease), filter 800ms var(--ease); }
    .reveal.is-in { opacity: 1; transform: none; filter: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; filter: none; transition: none; } }

/* Workbench layout: square sidebar, soft nested content surfaces. */
body{background:var(--canvas)}.mesh{opacity:.55}.workspace{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh;position:relative;z-index:1}.sidebar{position:sticky;top:0;height:100dvh;padding:30px 18px;background:#e8ebe7;box-shadow:inset -1px 0 0 var(--hairline);display:flex;flex-direction:column}.side-brand{display:flex;align-items:center;gap:11px;padding:8px 12px 32px;font-size:18px;font-weight:700;letter-spacing:-.03em}.side-brand .brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-glow));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}.side-caption{font:10px var(--mono);letter-spacing:.18em;color:var(--muted);padding:0 12px 12px}.side-group{padding:12px 0;border-top:1px solid var(--hairline)}.side-group h2{font-size:13px;letter-spacing:.02em;margin:0 12px 12px;color:var(--ink)}.side-nav{display:grid;gap:5px}.side-nav button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:0;border-radius:10px;color:var(--muted);font:600 13px var(--sans);cursor:pointer;transition:background 300ms var(--ease),transform 300ms var(--ease)}.side-nav button:hover{background:rgba(255,255,255,.5)}.side-nav button.active{background:#fcfcfa;color:var(--accent);box-shadow:inset 0 0 0 1px var(--hairline),0 10px 24px -20px rgba(10,10,10,.2)}.side-nav .nav-icon{font:15px var(--mono);width:20px;text-align:center}.side-foot{margin-top:auto;padding:15px 12px 0;border-top:1px solid var(--hairline);font:10px/1.7 var(--mono);letter-spacing:.06em;color:var(--muted)}.workspace-main{min-width:0;padding:48px clamp(24px,4vw,68px) 72px;max-width:1600px;width:100%;margin:auto}.workspace-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:36px}.workspace-top h1{font-size:clamp(38px,4.5vw,64px);letter-spacing:-.04em;line-height:1.04;margin:17px 0 12px}.workspace-top p{max-width:56ch;color:var(--muted);margin:0;font-size:15px}.top-note{font:11px var(--mono);color:var(--muted);white-space:nowrap;padding-top:10px}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:42px}.overview .b-card .core{padding:23px;min-height:124px}.overview .b-card .meta{margin-bottom:8px}.overview .stat{margin-top:0}.overview .stat .big{font-size:38px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section-title h2{font-size:clamp(26px,3vw,38px);margin:11px 0 0;letter-spacing:-.03em}.section-title p{margin:0;color:var(--muted);font-size:13px}.calendar-section{padding-top:0}.calendar-shell{border-radius:28px}.calendar-core{border-radius:22px}.calendar-tools{margin-bottom:18px}.calendar-tools h3{font-size:19px}.week-grid{grid-template-columns:repeat(7,minmax(175px,1fr));gap:10px}.week-card .core{padding:18px;min-height:330px}.week-card h3{font-size:17px}.workspace-footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--hairline);font:11px var(--mono);color:var(--muted)}@media(max-width:1050px){.workspace{grid-template-columns:210px minmax(0,1fr)}.sidebar{padding:22px 12px}.workspace-main{padding:36px 22px}.week-grid{grid-template-columns:repeat(7,minmax(190px,1fr))}}@media(max-width:767px){.workspace{display:block}.sidebar{height:auto;position:relative;padding:14px 18px 16px}.side-brand{padding:0 0 12px}.side-caption,.side-foot{display:none}.side-group{padding:10px 0 0}.side-group h2{margin:0 0 10px}.side-nav{display:grid;grid-template-columns:1fr 1fr}.side-nav button{padding:10px 8px;font-size:12px}.workspace-main{padding:26px 16px 56px}.workspace-top{display:block;margin-bottom:22px}.workspace-top h1{font-size:38px}.top-note{padding-top:16px}.overview{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:32px}.overview .b-card{padding:4px;border-radius:18px}.overview .b-card .core{min-height:95px;padding:10px;border-radius:14px}.overview .b-card .meta{font-size:8px;letter-spacing:.05em}.overview .stat .big{font-size:24px}.overview .stat .unit{font-size:9px}.section-title{display:block}.section-title p{margin-top:8px}.week-grid{grid-template-columns:1fr}}
</style></head><body><div class="mesh" aria-hidden="true"></div><div class="workspace"><aside class="sidebar" aria-label="工作台导航"><div class="side-brand"><span class="brand-mark"></span><span>直播工作台</span></div><div class="side-caption">WORKSPACE / 2026</div><div class="side-group"><h2>直播讯息</h2><nav class="side-nav"><button data-tab="month" class="active" aria-pressed="true"><span class="nav-icon">▦</span>上新月历</button><button data-tab="week" aria-pressed="false"><span class="nav-icon">☷</span>直播场次</button></nav></div><div class="side-foot">2026 年 11 月排班<br>以最新公布信息为准</div></aside><main class="workspace-main"><header class="workspace-top"><div><span class="eyebrow"><span class="dot"></span>LIVE INFORMATION</span><h1>直播讯息<span style="color:var(--muted);font-weight:500">工作台</span></h1><p>上新与活动看月历，主播和助播安排看每周直播场次。</p></div><div class="top-note">NOVEMBER / 2026</div></header><div class="overview"><div class="b-card"><div class="core"><div class="meta">本月直播</div><div class="stat"><span class="big" id="heroSlots">—</span></div></div></div><div class="b-card"><div class="core"><div class="meta">上新日期</div><div class="stat"><span class="big" id="heroNew">—</span></div></div></div><div class="b-card"><div class="core"><div class="meta">平台活动</div><div class="stat"><span class="big" id="heroEvents">—</span></div></div></div></div><section class="calendar-section" id="schedule"><div id="monthView"><div class="section-title"><div><span class="eyebrow"><span class="dot"></span>01 · LIVE INFORMATION</span><h2>上新月历</h2></div><p>按月查看抖音上新、活动与每日场次</p></div><div class="calendar-tools"><h3 id="monthTitle"></h3><button class="ghost" id="prev" aria-label="上个月">←</button><button class="ghost" id="next" aria-label="下个月">→</button><button class="ghost" id="today">回到十一月</button></div><div class="legend"><span>● 新品上新</span><span>● 平台活动</span><span>● 直播场次</span></div><div class="calendar-shell"><div class="calendar-core"><div class="calendar-grid" id="calendar"></div></div></div></div><div id="weekView" class="hide"><div class="section-title"><div><span class="eyebrow"><span class="dot"></span>02 · LIVE INFORMATION</span><h2>直播场次</h2></div><p>按周查看场次、主播和助播</p></div><div class="calendar-tools"><h3 id="weekTitle"></h3><button class="ghost" id="weekPrev" aria-label="上一周">←</button><button class="ghost" id="weekNext" aria-label="下一周">→</button><button class="ghost" id="weekToday">本周</button></div><div class="week-grid" id="weekList"></div></div></section><footer class="workspace-footer">直播讯息 · 仅展示面向观众的排班信息 · 排班如有调整，以最新公布为准</footer></main></div><script type="module" src="/calendar.js"></script></body></html>
