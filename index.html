<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>直播日历｜2026</title>
<style>
:root{--ink:#242336;--muted:#858399;--line:#eceaf4;--purple:#6d5dfc;--lav:#f5f3ff;--pink:#ff7b9c;--bg:#fbfbfe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 24px 48px}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.eyebrow{color:var(--purple);font-weight:700;letter-spacing:2px;font-size:12px}.hero h1{font-size:32px;margin:6px 0 0}.hero p{color:var(--muted);margin:6px 0 0}.tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:14px}.tabs button{border:0;background:transparent;padding:10px 20px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:700}.tabs button.active{background:var(--purple);color:#fff}.toolbar{display:flex;align-items:center;gap:12px;margin:18px 0}.toolbar button,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink)}.month{font-size:20px;font-weight:800;min-width:140px}.grid{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.dow{padding:13px;text-align:center;color:var(--muted);font-weight:700;background:#faf9ff;border-bottom:1px solid var(--line)}.day{min-height:126px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}.day:nth-child(7n){border-right:0}.day.muted{background:#fcfcfe;color:#c9c7d4}.num{font-weight:800;margin-bottom:8px}.today .num{background:var(--purple);color:white;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}.pill{font-size:12px;border-radius:7px;padding:4px 7px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.new{background:#fff1f5;color:#d84770}.event{background:#fff5df;color:#a66a00}.live{background:#eef0ff;color:#5544d4}.week{display:grid;gap:12px}.week-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.date-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.date-title strong{font-size:17px}.badge{background:var(--lav);color:var(--purple);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.slot{display:grid;grid-template-columns:80px 1fr 170px;gap:14px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.slot:first-of-type{border-top:0}.time{font-weight:800;color:var(--purple)}.product{color:#55536c}.people{color:var(--muted);text-align:right}.empty{color:var(--muted);padding:28px 0;text-align:center}.legend{display:flex;gap:18px;color:var(--muted);margin:16px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.notice{margin-top:20px;color:var(--muted);font-size:12px}.hide{display:none}@media(max-width:700px){.app{padding:20px 12px}.hero{display:block}.tabs{margin-top:16px}.day{min-height:100px;padding:7px}.pill{font-size:10px}.slot{grid-template-columns:62px 1fr;gap:8px}.people{text-align:left;grid-column:2}.hero h1{font-size:25px}}
</style></head>
<body><main class="app"><header class="hero"><div><div class="eyebrow">LIVE SCHEDULE</div><h1>直播日历</h1><p>每天都有好内容，来看看本周和本月的直播安排</p></div><nav class="tabs"><button class="active" data-tab="month">月历</button><button data-tab="week">周历</button></nav></header><section id="monthView"><div class="toolbar"><button id="prev">‹</button><div class="month" id="monthTitle"></div><button id="next">›</button><button id="today">回到今天</button></div><div class="legend"><span><i class="dot" style="background:#ff7b9c"></i>新品上新</span><span><i class="dot" style="background:#e6a52f"></i>平台活动</span><span><i class="dot" style="background:#6d5dfc"></i>直播场次</span></div><div class="grid" id="calendar"></div></section><section id="weekView" class="hide"><div class="toolbar"><button id="weekPrev">‹</button><div class="month" id="weekTitle"></div><button id="weekNext">›</button><button id="weekToday">本周</button></div><div class="week" id="weekList"></div></section><div class="notice">信息来自直播排班表 · 以最新排班为准</div></main>
<script>
const schedule=[
 {date:'2026-11-16',slot:'早场',host:'林小满',assist:'小七',new:'冬日焕新礼盒',event:'双11返场'},
 {date:'2026-11-16',slot:'中午场',host:'安安',assist:'小七'},
 {date:'2026-11-17',slot:'晚场',host:'林小满',assist:'阿杰',new:'轻盈保湿面霜'},
 {date:'2026-11-18',slot:'早场',host:'安安',assist:'小七',event:'会员日'},
 {date:'2026-11-19',slot:'中午场',host:'林小满',assist:'阿杰',new:'年末限定礼盒'},
 {date:'2026-11-21',slot:'晚场',host:'安安',assist:'小七',event:'周末专场'}
];
let cursor=new Date('2026-11-01'), weekCursor=new Date('2026-11-16');
const fmt=d=>d.toISOString().slice(0,10), zh=['日','一','二','三','四','五','六'];
function renderMonth(){let y=cursor.getFullYear(),m=cursor.getMonth();monthTitle.textContent=`${y}年${m+1}月`;let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();calendar.innerHTML=zh.map(x=>`<div class="dow">周${x}</div>`).join('');for(let i=0;i<start;i++)calendar.innerHTML+=`<div class="day muted"></div>`;for(let d=1;d<=days;d++){let date=fmt(new Date(y,m,d)), rows=schedule.filter(x=>x.date===date), cls=date==='2026-11-14'?'today':'';calendar.innerHTML+=`<div class="day ${cls}"><div class="num">${d}</div>${rows.some(x=>x.new)?`<div class="pill new">新品：${rows.find(x=>x.new).new}</div>`:''}${rows.some(x=>x.event)?`<div class="pill event">活动：${rows.find(x=>x.event).event}</div>`:''}${rows.length?`<div class="pill live">${rows.length}场直播</div>`:''}</div>`}}
function monday(d){let x=new Date(d), n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}function renderWeek(){let s=monday(weekCursor);weekTitle.textContent=`${fmt(s).replaceAll('-','/')} — ${fmt(new Date(s.getTime()+6*864e5)).slice(5).replace('-','/')}`;weekList.innerHTML='';for(let i=0;i<7;i++){let d=new Date(s.getTime()+i*864e5), date=fmt(d), rows=schedule.filter(x=>x.date===date);weekList.innerHTML+=`<article class="week-card"><div class="date-title"><strong>${date.slice(5).replace('-','月')+'日'} 周${zh[d.getDay()]}</strong><span class="badge">${rows.length?rows.length+' 场直播':'暂无直播'}</span></div>${rows.length?rows.map(x=>`<div class="slot"><div class="time">${x.slot}</div><div><b>${x.new||'直播专场'}</b><div class="product">${x.event||'欢迎来直播间'}</div></div><div class="people">主播：${x.host}<br>助播：${x.assist}</div></div>`).join(''):`<div class="empty">今天没有排班，期待下次见</div>`}</article>`}}
prev.onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderMonth()};next.onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderMonth()};today.onclick=()=>{cursor=new Date('2026-11-01');renderMonth()};weekPrev.onclick=()=>{weekCursor.setDate(weekCursor.getDate()-7);renderWeek()};weekNext.onclick=()=>{weekCursor.setDate(weekCursor.getDate()+7);renderWeek()};weekToday.onclick=()=>{weekCursor=new Date('2026-11-16');renderWeek()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');monthView.classList.toggle('hide',b.dataset.tab!=='month');weekView.classList.toggle('hide',b.dataset.tab!=='week');if(b.dataset.tab==='week')renderWeek()});renderMonth();
</script></body></html>
