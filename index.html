<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>直播日历｜2026</title>
<style>
:root{--ink:#242336;--muted:#858399;--line:#eceaf4;--purple:#6d5dfc;--lav:#f5f3ff;--pink:#ff7b9c;--bg:#fbfbfe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 24px 48px}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.eyebrow{color:var(--purple);font-weight:700;letter-spacing:2px;font-size:12px}.hero h1{font-size:32px;margin:6px 0 0}.hero p{color:var(--muted);margin:6px 0 0}.tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:14px}.tabs button{border:0;background:transparent;padding:10px 20px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:700}.tabs button.active{background:var(--purple);color:#fff}.toolbar{display:flex;align-items:center;gap:12px;margin:18px 0}.toolbar button,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink)}.month{font-size:20px;font-weight:800;min-width:140px}.grid{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.dow{padding:13px;text-align:center;color:var(--muted);font-weight:700;background:#faf9ff;border-bottom:1px solid var(--line)}.day{min-height:126px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}.day:nth-child(7n){border-right:0}.day.muted{background:#fcfcfe;color:#c9c7d4}.num{font-weight:800;margin-bottom:8px}.today .num{background:var(--purple);color:white;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}.pill{font-size:12px;border-radius:7px;padding:4px 7px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.new{background:#fff1f5;color:#d84770}.event{background:#fff5df;color:#a66a00}.live{background:#eef0ff;color:#5544d4}.week{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:16px;align-items:stretch;overflow-x:auto;padding:2px 2px 18px}.week-card{background:#fff;border:1px solid #e5e3ea;border-radius:10px;padding:20px 16px;min-height:450px;box-shadow:0 1px 3px rgba(35,30,60,.04)}.week-card:first-child{border-color:#00a99d}.date-title{display:block;margin-bottom:24px}.date-title strong{font-size:14px;color:#20212a}.badge{display:none}.day-info{margin:0 0 22px}.info-label{font-size:13px;color:#6b6b75;margin-bottom:7px}.info-value{font-size:13px;line-height:1.65;color:#2d2d38}.slot{display:block;border:0;padding:0;margin:0 0 22px}.slot:first-of-type{border-top:0}.time{font-weight:500;color:#6b6b75;font-size:13px;margin-bottom:6px}.time:before{content:'☷';font-size:15px;margin-right:7px;color:#777}.people{color:#514b70;text-align:left;font-size:12px;line-height:1.8}.people br{display:block}.people span{display:block}.empty{color:#b1afb9;padding:28px 0;text-align:left;font-size:13px}.legend{display:flex;gap:18px;color:var(--muted);margin:16px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.notice{margin-top:20px;color:var(--muted);font-size:12px}.hide{display:none}@media(max-width:700px){.app{padding:20px 12px}.hero{display:block}.tabs{margin-top:16px}.day{min-height:100px;padding:7px}.pill{font-size:10px}.week{grid-template-columns:repeat(2,minmax(210px,1fr));gap:10px}.week-card{min-height:360px;padding:16px 13px}.hero h1{font-size:25px}}
</style></head>
<body><main class="app"><header class="hero"><div><div class="eyebrow">LIVE SCHEDULE</div><h1>直播日历</h1><p>每天都有好内容，来看看本周和本月的直播安排</p></div><nav class="tabs"><button class="active" data-tab="month">月历</button><button data-tab="week">周历</button></nav></header><section id="monthView"><div class="toolbar"><button id="prev">‹</button><div class="month" id="monthTitle"></div><button id="next">›</button><button id="today">回到今天</button></div><div class="legend"><span><i class="dot" style="background:#ff7b9c"></i>新品上新</span><span><i class="dot" style="background:#e6a52f"></i>平台活动</span><span><i class="dot" style="background:#6d5dfc"></i>直播场次</span></div><div class="grid" id="calendar"></div></section><section id="weekView" class="hide"><div class="toolbar"><button id="weekPrev">‹</button><div class="month" id="weekTitle"></div><button id="weekNext">›</button><button id="weekToday">本周</button></div><div class="week" id="weekList"></div></section><div class="notice">信息来自直播排班表 · 以最新排班为准</div></main>
<script type="module">
import days from './november-2026.json';
const schedule=days.map(d=>({...d,slots:d.slots||[]}));
let cursor=new Date('2026-11-01'), weekCursor=new Date('2026-11-16');
document.querySelector('.notice').textContent='已读取2026年11月排班表 · 排班如有调整，以最新公布信息为准';
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,zh=['日','一','二','三','四','五','六'];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderMonth(){let y=cursor.getFullYear(),m=cursor.getMonth();monthTitle.textContent=`${y}年${m+1}月`;let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();calendar.innerHTML=zh.map(x=>`<div class="dow">周${x}</div>`).join('');for(let i=0;i<start;i++)calendar.innerHTML+=`<div class="day muted"></div>`;for(let d=1;d<=days;d++){let date=fmt(new Date(y,m,d)), rows=schedule.filter(x=>x.date===date), cls=date==='2026-11-14'?'today':'';calendar.innerHTML+=`<div class="day ${cls}"><div class="num">${d}</div>${rows.some(x=>x.new)?`<div class="pill new">新品：${safe(rows[0].new)}</div>`:''}${rows.some(x=>x.event)?`<div class="pill event">活动：${safe(rows[0].event)}</div>`:''}${rows[0]?.slots.length?`<div class="pill live">${rows[0].slots.length}场直播</div>`:''}</div>`}}
function monday(d){let x=new Date(d), n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}function renderWeek(){let s=monday(weekCursor);weekTitle.textContent=`${fmt(s).replaceAll('-','/')} — ${fmt(new Date(s.getTime()+6*864e5)).slice(5).replace('-','/')}`;weekList.innerHTML='';for(let i=0;i<7;i++){let d=new Date(s.getTime()+i*864e5), date=fmt(d), rows=schedule.filter(x=>x.date===date), products=[...new Set(rows.filter(x=>x.new).map(x=>x.new))], events=[...new Set(rows.filter(x=>x.event).map(x=>x.event))];weekList.innerHTML+=`<article class="week-card"><div class="date-title"><strong>${date.slice(5).replace('-','月')+'日'} 周${zh[d.getDay()]}</strong></div>${products.length?`<div class="day-info"><div class="info-label">▧ 抖音上新</div><div class="info-value">${safe(products.join('、'))}</div></div>`:''}${events.length?`<div class="day-info"><div class="info-label">▧ 抖音活动</div><div class="info-value">${safe(events.join('、'))}</div></div>`:''}${rows[0]?.slots.length?rows[0].slots.map(x=>`<div class="slot"><div class="time">${safe(x.slot)}</div><div class="people"><span>主播：${safe(x.host)}</span><br><span>助播：${safe(x.assist)}</span></div></div>`).join(''):`<div class="empty">今天没有排班，期待下次见</div>`}</article>`}}
prev.onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderMonth()};next.onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderMonth()};today.onclick=()=>{cursor=new Date('2026-11-01');renderMonth()};weekPrev.onclick=()=>{weekCursor.setDate(weekCursor.getDate()-7);renderWeek()};weekNext.onclick=()=>{weekCursor.setDate(weekCursor.getDate()+7);renderWeek()};weekToday.onclick=()=>{weekCursor=new Date('2026-11-16');renderWeek()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');monthView.classList.toggle('hide',b.dataset.tab!=='month');weekView.classList.toggle('hide',b.dataset.tab!=='week');if(b.dataset.tab==='week')renderWeek()});renderMonth();
</script></body></html>
